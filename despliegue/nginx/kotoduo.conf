# Kotoduo Producción - sitio Nginx (Informe 3, §8.2 B.9 y B.10)
#
# Instalar en: /etc/nginx/sites-available/kotoduo.conf
#   sudo ln -s /etc/nginx/sites-available/kotoduo.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Después (§8.2 B.10, RNF-07):
#   sudo certbot --nginx -d <dominio> --redirect --hsts --uir
#
# Notas de seguridad:
#   · root apunta a prototipo/, nunca a datos/: kotoduo.db y documentos.json
#     no son servibles aunque algo falle en la aplicación.
#   · Todo lo que no sea un archivo estático cae en la API (127.0.0.1:8000).
#   · /auth/login tiene límite de intentos contra fuerza bruta.
#   · Si se activa HTTPS, añadir en el bloque server:
#       add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

limit_req_zone  $binary_remote_addr zone=login:10m  rate=5/m;
limit_conn_zone $binary_remote_addr zone=por_ip:10m;

upstream kotoduo_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;              # <- reemplazar por el dominio antes de certbot

    root /opt/kotoduo/prototipo;
    index index.html;
    server_tokens off;
    client_max_body_size 256k;  # la API solo recibe JSON, sin subidas de archivo

    access_log /var/log/nginx/kotoduo.access.log;
    error_log  /var/log/nginx/kotoduo.error.log warn;

    limit_conn por_ip 20;

    # Cabeceras de seguridad (heredadas por todos los bloques que no declaren
    # su propia lista de add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- Interfaz: si el archivo existe se sirve desde disco, si no, a la API ---
    location / {
        try_files $uri @api;
    }

    # Recursos con caché larga (declarar add_header aquí anula las del bloque
    # server, por eso se repiten)
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        access_log off;
    }

    # Sonda de estado para el monitoreo y el balanceo (sin datos)
    location = /health {
        access_log off;
        proxy_pass http://kotoduo_api/health;
        include /etc/nginx/kotoduo_proxy.conf;
    }

    # Login con límite de intentos: 429 en lugar de un castigo silencioso
    location = /auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://kotoduo_api;
        include /etc/nginx/kotoduo_proxy.conf;
    }

    # Todo lo demás (API, errores JSON, /docs si se reactiva)
    location @api {
        proxy_pass http://kotoduo_api;
        include /etc/nginx/kotoduo_proxy.conf;
    }
}
